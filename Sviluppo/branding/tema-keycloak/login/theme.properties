# Tema di login. Eredita da keycloak e AGGIUNGE un foglio, senza
# sostituirne nessuno.
parent=keycloak
import=common/keycloak

# ATTENZIONE, errore da non rifare: il file proprio NON puo' chiamarsi
# css/login.css. Il tema genitore ha esattamente quel nome, e la risoluzione
# delle risorse preferisce il tema figlio: il risultato e' che il foglio di
# Keycloak viene SOSTITUITO invece di essere integrato, e la pagina resta in
# piedi solo grazie al CSS di PatternFly. Sintomo: servono molti !important
# per ottenere qualsiasi cosa.
# Il primo foglio e' quello del genitore, il secondo il nostro.
styles=css/login.css css/tema-azienda.css

# Senza questa riga i file messages/messages_*.properties del tema vengono
# ignorati e restano i testi standard di Keycloak: la lingua funziona
# comunque, ma le personalizzazioni no.
locales=it,en,de
