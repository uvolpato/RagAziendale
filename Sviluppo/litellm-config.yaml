# Routing dei modelli. L'orchestratore conosce solo i nomi logici
# (ragionamento, veloce, embedding): cambiare modello e cambiare QUESTO file.
# Niente deploy, niente codice.
#
# Guida alla scelta e alla configurazione: GUIDA-MODELLI.md (radice del progetto).

model_list:

  # =====================================================================
  # ragionamento — modello principale, SCELTO: Qwen3 27B su LM Studio.
  # Contesto: il massimo che i 16 GB reggono (in LM Studio si alza finche'
  # il modello ci sta in memoria; 12947 era solo il valore iniziale).
  # =====================================================================
  - model_name: ragionamento
    litellm_params:
      model: os.environ/MODELLO_RAGIONAMENTO
      api_key: os.environ/MODELLO_API_KEY
      api_base: os.environ/MODELLO_API_BASE   # vuoto se il provider e pubblico

  # ---------------------------------------------------------------------
  # veloce — non ancora scelto: si ripiega sul principale finche' l'eval
  # non dice se un modello economico regge (scommentare per attivarlo).
  # ---------------------------------------------------------------------
  # - model_name: veloce
  #   litellm_params:
  #     model: ${MODELLO_VELOCE}
  #     api_key: os.environ/MODELLO_VELOCE_API_KEY
  #     api_base: os.environ/MODELLO_VELOCE_API_BASE

  # ---------------------------------------------------------------------
  # embedding — locale per obbligo, non per scelta: in ingestion passa il
  # testo di ogni chunk di ogni documento. bge-m3, 1024 dimensioni, come
  # la colonna vector(1024) in initdb. NON sostituibile senza reindicizzare.
  # ---------------------------------------------------------------------
  - model_name: embedding
    litellm_params:
      # Server dedicato (vLLM, TEI, Ollama...): "openai/<id esatto del
      # modello>" e api_base https://<server>:7443/v1. Cambiare modello vuol
      # dire reindicizzare: l'indicizzazione se ne accorge (index_meta) e
      # smette di scrivere vettori con un'anomalia critica.
      model: lm_studio/text-embedding-bge-m3-embeddings
      api_base: os.environ/EMBEDDING_URL
      # Il token davanti all'host di inferenza (inference/Caddyfile). Vuoto in
      # sviluppo: LM Studio non autentica.
      api_key: os.environ/INFERENCE_TOKEN

  # ---------------------------------------------------------------------
  # FASE 1b — ragionamento sui dati che non lasciano l'azienda.
  # Stesso schema OpenAI-compatible: per l'orchestratore e una rotta come
  # le altre. Il gate decide quale usare, non il codice del nodo.
  # In sviluppo punta allo STESSO modello locale: i dati non escono comunque.
  # ---------------------------------------------------------------------
  - model_name: ragionamento_interno
    litellm_params:
      model: os.environ/MODELLO_RAGIONAMENTO
      api_base: os.environ/MODELLO_API_BASE
      api_key: os.environ/MODELLO_API_KEY

  # ---------------------------------------------------------------------
  # visione — il modello multimodale che descrive le figure dei cataloghi
  # durante l'indicizzazione. Come `ragionamento`, passa da litellm: il
  # modello vero lo decide questo file, e l'ingestion lo chiama per nome
  # logico, non piu' direttamente su llama-swap (che ascolta solo loopback
  # e non e' raggiungibile dai container — 23/09/2026 le figure restavano
  # senza descrizione, quindi i colori dei prodotti non entravano nell'indice).
  # ---------------------------------------------------------------------
  - model_name: visione
    litellm_params:
      model: lm_studio/qwen/qwen3-vl-4b
      api_base: os.environ/MODELLO_API_BASE
      api_key: os.environ/MODELLO_API_KEY

router_settings:
  # Se il modello principale non risponde, meglio una risposta dal veloce
  # che nessuna risposta (da riattivare quando ragionamento/veloce esistono).
  # fallbacks: [{"ragionamento": ["veloce"]}]
  num_retries: 2

litellm_settings:
  # Scarta i parametri che un provider non conosce invece di dare errore:
  # indispensabile quando il modello e una variabile.
  drop_params: true
  # Le tracce restano nostre: nessun callback verso servizi terzi.
  success_callback: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
