# SVILUPPO — Docker Desktop su Windows (WSL2). Applicato automaticamente da
# `docker compose up`. In produzione questo file NON esiste: la VM Linux usa
# solo docker-compose.yml.
#
# I modelli NON sono qui: stanno su LM Studio, nativo sulla macchina di
# sviluppo, fuori da Docker. L'unica differenza e' il valore di EMBEDDING_URL.
#
# ATTENZIONE: non lasciare che la macchina di sviluppo diventi la produzione
# per inerzia. Succede quando funziona abbastanza bene.

services:

  caddy:
    # Alias di rete: dall'INTERNO dei container, assistente.localhost e
    # sso.localhost devono risolvere a Caddy. Senza, LibreChat cerca
    # sso.localhost, ottiene 127.0.0.1 (se stesso) e la discovery OIDC
    # fallisce con "fetch failed".
    networks:
      default:
        aliases:
          - assistente.localhost
          - sso.localhost

  keycloak:
    # Esposto solo in sviluppo, per ottenere token da riga di comando
    # (vedi keycloak/README.md). In produzione si raggiunge solo via Caddy.
    ports:
      - "8081:8080"
    environment:
      # Keycloak mette i temi in cache: senza questo, le modifiche al CSS o
      # al logo NON compaiono e si perde tempo a cercare un errore che non
      # c'e'. Solo sviluppo: in produzione la cache serve.
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
      KC_SPI_THEME_STATIC_MAX_AGE: "-1"

  librechat:
    # openid-client (Node) accetta SOLO discovery su HTTPS: non c'e' modo di
    # usare http://keycloak:8080 per la configurazione OIDC. Quindi LibreChat
    # passa da Caddy via HTTPS, e per farlo deve fidarsi della CA interna di
    # Caddy. avvia.py la estrae in certs/ prima di avviare questo servizio.
    # In produzione al suo posto c'e' il certificato aziendale, gia' fidato.
    volumes:
      - ./certs:/certs:ro
    environment:
      NODE_EXTRA_CA_CERTS: /certs/caddy-root.crt
      # I test di login ripetuti fanno scattare il rate limiter di LibreChat
      # ("Too many login attempts, please try again after 5 minutes"), e il
      # sintomo e' un 429 su /oauth/openid che sembra un guasto.
      # Rilassato SOLO in sviluppo: in produzione il limite serve.
      # Default: 7 tentativi ogni 5 minuti. I ban durano DUE ORE, quindi
      # vanno disattivati o un test di troppo blocca la macchina a lungo.
      LOGIN_MAX: "100"
      LOGIN_WINDOW: "1"
      BAN_VIOLATIONS: "false"

  docling:
    # Lettura dei documenti su GPU come SERVIZIO a parte. In sviluppo NON si
    # avvia (profilo): tiene i modelli in VRAM sempre, ~3 GB, e su questa
    # macchina la stessa scheda serve a LM Studio per il modello di chat.
    # Qui la GPU la usa direttamente ingestion, nel processo figlio che legge
    # un blocco di pagine e poi muore: la VRAM torna libera fra un blocco e
    # l'altro. Questa forma resta quella di PRODUZIONE, dove la GPU e'
    # dedicata: ingestion la raggiunge con DOCLING_URL.
    #   docker compose --profile docling-serve up -d docling    per provarla
    profiles: ["docling-serve"]
    # ponytail: tag pinnato; aggiornare insieme a docling in ingestion/.
    image: quay.io/docling-project/docling-serve-cu128:v1.34.0
    restart: unless-stopped
    environment:
      DOCLING_DEVICE: cuda
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "true"
      DOCLING_SERVE_MAX_SYNC_WAIT: "900"
      # Niente chiamate a servizi esterni dalla pipeline (egress).
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "false"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ingestion:
    environment:
      # Vuoto: si legge QUI, con la GPU della macchina (vedi deploy sotto).
      # Valorizzato: si manda tutto a docling-serve, che e' la forma di
      # produzione. `${VAR-...}` (senza `:`) rispetta un valore vuoto esplicito.
      DOCLING_URL: ${DOCLING_URL-}
      # La finestra e' in ora locale: senza TZ il container ragiona in UTC e
      # d'estate si aprirebbe alle 20.
      TZ: Europe/Rome
      GPU: ${GPU-auto}
      VRAM_MINIMA_MB: ${VRAM_MINIMA_MB-3500}
      # Scaricare il modello di chat per far posto a Docling: serviva quando i
      # modelli non stavano tutti in VRAM. Ora ci stanno (11,1 GB su 16,3) e
      # scaricarlo faceva pagare 34 s di ricarica a ogni messaggio in chat.
      SCARICA_CHAT: ${SCARICA_CHAT-si}
      FINESTRA_NOTTE: ${FINESTRA_NOTTE-}
      MB_MAX_DI_GIORNO: ${MB_MAX_DI_GIORNO-0}
      # Il server dei modelli sta FUORI da Docker, sulla macchina: da qui si
      # raggiunge con host.docker.internal, come per i vettori. Dal 21/09/2026
      # e' llama-swap sulla 1235 (prima LM Studio sulla 1234). Serve per
      # scaricare il modello di chat e fare spazio a Docling.
      MODELLI_HOST: ${MODELLI_HOST-host.docker.internal:1235}
      MODELLO_CHAT: ${MODELLO_CHAT-qwen3-8b-gsq}
      # Chi descrive le immagini: un VLM su LM Studio (Qwen3-VL 4B, 3,3 GB:
      # trascrive le etichette e descrive colori e materiali), oppure off.
      # Dentro il servizio non ne gira piu' nessuno: pesava 3,3 GB e diceva
      # solo "a few bottles".
      VLM_DESCRIZIONI: ${VLM_DESCRIZIONI-api}
      VLM_URL: ${VLM_URL-http://host.docker.internal:1235/v1}
      VLM_MODELLO: ${VLM_MODELLO-}
      # Come si legge il TESTO dei PDF:
      #   docling  (predefinito) layout + OCR. Buono sulla prosa.
      #   pagina   il VLM guarda la PAGINA e produce Markdown. Per i cataloghi
      #            a griglia, dove Docling non vede le tabelle: su EUROSAND
      #            pagina 7 trovava zero tabelle e nessun titolo (21/09/2026).
      # Le IMMAGINI le estrae Docling in entrambi i casi.
      LETTURA: ${LETTURA-docling}
      # Le fonti a GRIGLIA (cataloghi), che si leggono a pagina col VLM.
      # Non e' globale: sui documenti di prosa Docling da solo fa gia' 4/4,
      # e il prompt «catalogo» li' imporrebbe una griglia che non c'e'.
      # E' la D16 in piccolo: quando ci sara' l'impostazione per fonte nel
      # pannello, questa variabile sparisce.
      LETTURA_PAGINA: ${LETTURA_PAGINA-}
      # Nel percorso a pagina: dove finiscono le descrizioni delle figure.
      #   si  dentro al Markdown di Docling, al posto dei segnaposto
      #       `<!-- image -->`, cioe' accanto al codice articolo della figura.
      #       Si indicizza quel Markdown, ed e' il file che si trova su disco
      #       in `_sorgenti/<hash>/markdown-figure/`.
      #   no  staccate, una per figura, come prima del 22/09/2026. Serve a
      #       misurare se il testo di Docling aggiunga qualcosa o faccia solo
      #       doppione del Markdown del VLM.
      TESTO_DOCLING: ${TESTO_DOCLING-si}
      DPI_PAGINA: ${DPI_PAGINA-150}
      # Il Markdown del VLM si tiene da solo finche' il PDF e' lo stesso: un
      # --forza rispezza senza richiamare il modello (secondi invece di venti
      # minuti). RILEGGI_MARKDOWN=1 forza la rilettura, se si sospetta che il
      # modello abbia letto male.
      RILEGGI_MARKDOWN: ${RILEGGI_MARKDOWN-}
      # Prezzi trascritti dalle immagini: fuori dall'indice di regola (i prezzi
      # vengono dal gestionale, decisione 72), ammessi sui cataloghi fornitore
      # dove sono l'unico prezzo esistente.
      PREZZI_DESCRIZIONI: ${PREZZI_DESCRIZIONI-escludi}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  orchestratore:
    volumes:
      - ./orchestratore:/app/orchestratore:ro   # ricarica a caldo
    environment:
      LOG_LEVEL: debug
      # Rerank: il cross-encoder gira sull'host con gli altri modelli
      # (llama-swap), non dentro un container. Vuoto = niente rerank, si tiene
      # l'ordine della fusione come prima.
      RERANK_URL: ${RERANK_URL-http://host.docker.internal:1235/v1}
      CANDIDATI_RERANK: ${CANDIDATI_RERANK-150}
      # Il modello deve RIPORTARE quello che sta nel contesto, non inventare:
      # la creativita non serve, la ripetibilita si. Senza, la stessa domanda
      # dava risposte diverse a minuti di distanza (22/09/2026).
      TEMPERATURA: ${TEMPERATURA-0.2}

  postgres:
    # 55432 e non 5432 ne 5433: sulla macchina di sviluppo ci sono DUE cluster
    # PostgreSQL nativi come servizi Windows, su entrambe quelle porte.
    # Windows consente a due processi di ascoltare sulla stessa porta in certe
    # configurazioni e il nativo vince: il sintomo e' un "autenticazione con
    # password fallita" con la password GIUSTA, perche' risponde un altro
    # server. Verificare con netstat prima di scegliere una porta.
    # Dentro la rete del compose i servizi parlano comunque con postgres:5432.
    ports:
      - "55432:5432"
