# Configurazione di llama-swap: sostituisce LM Studio come SERVER dei modelli.
#
#   llama-swap.exe --config llama-swap.yaml --listen 127.0.0.1:1235
#
# Perche' non Docker: i modelli girano sull'host, come oggi con LM Studio. Su
# Windows Docker tiene per se' memoria e GPU e non le restituisce; i container
# raggiungono l'host con host.docker.internal, che e' gia' il modo in cui
# funziona il progetto (decisione del 21/09/2026).
#
# LM Studio resta installato come GESTORE dei modelli — e' lui che li scarica e
# tiene aggiornate le versioni di llama.cpp — ma non fa piu' il server. Per
# questo i .gguf stanno ancora nella sua cartella: nessun file duplicato,
# niente da riscaricare. Se un giorno LM Studio esce di scena, si sposta la
# cartella e si cambia la macro `modelli` qui sotto.
#
# I NOMI dei modelli sono identici a quelli che esponeva LM Studio: cosi'
# litellm-config.yaml, .env e ingestion non cambiano di una riga. Si sposta
# solo la porta.
#
# TTL 0 OVUNQUE, per scelta (21/09/2026): tutti i modelli restano in memoria,
# nessuno si scarica da solo per inattivita'. Il costo di una ricarica non e'
# solo l'attesa — e' che cade addosso a chi sta facendo la domanda, e in una
# lettura di documenti si paga a ogni blocco. La VRAM costa meno del tempo
# delle persone.
#
# Questo NON disattiva lo scarico manuale: l'indicizzazione continua a
# scaricare il modello di chat quando serve spazio a Docling (scarica_llm in
# ingestion/indicizza.py, POST /api/models/unload/<id>), e llama-swap lo
# ricarica alla prima domanda successiva. ttl vuol dire «non scaricarlo da
# solo», non «non si puo' scaricare».

healthCheckTimeout: 500
logLevel: debug
logToStdout: "both"
# «both» mostra anche l'output dei modelli, non solo del proxy: senza, un
# processo che muore lascia soltanto un 499 nel registro e non si sa perche'.

macros:
  # Binari ufficiali di llama.cpp (build CUDA per Windows), non quelli interni
  # di LM Studio: quelli stanno in una cartella privata di un altro programma e
  # cambiano quando lui si aggiorna.
  llama: "C:/Users/uvolp/AppData/Local/llama-stack/bin/llama-server.exe"
  modelli: "C:/Users/uvolp/.lmstudio/models"
  # --n-gpu-layers 99 = tutto sulla GPU. Se un modello non ci sta, llama.cpp
  # non parte: meglio un errore leggibile che venti minuti di lettura in CPU.
  gpu: "--n-gpu-layers 99 --flash-attn on"

models:
  # ---- chat ------------------------------------------------------------
  # ATTENZIONE: --ctx-size e' il contesto TOTALE, diviso fra gli slot. Con
  # --parallel 4 ogni conversazione ne aveva 2.816 (verificato su /props), e
  # per il RAG e' troppo poco: una domanda di elenco recupera 20 pezzi
  # (PEZZI_ELENCO), che fanno 5.000 token abbondanti, piu' il prompt di sistema
  # e la cronologia. Il contesto veniva TRONCATO in silenzio, e il modello
  # rispondeva su meta' delle fonti senza che si vedesse (21/09/2026).
  #
  # Qui gli utenti sono al massimo due, uno in sviluppo: due slot bastano, e
  # ridurli NON costa VRAM — la cache KV dipende dal contesto totale, non dal
  # numero di slot. 16.384 in due = 8.192 a conversazione.
  # Se un giorno gli utenti in parallelo diventano cinque, si alza --parallel E
  # --ctx-size insieme, altrimenti si torna a troncare.
  "qwen3-8b-gsq":
    name: "Chat (Qwen3 8B GSQ)"
    cmd: |
      ${llama}
      --model ${modelli}/ISTA-DASLab/Qwen3-8B-GGUF-GSQ/qwen3-8b-Q3_K_M.gguf
      --port ${PORT}
      --ctx-size 16384
      --parallel 2
      # Rete di sicurezza contro la degenerazione: llama.cpp ha
      # repeat-penalty 1.0, cioe' disattivata, e il 22/09/2026 il modello e'
      # entrato in loop ripetendo «verde foglia (FSA1050), verde acero
      # (FSA1050)» per decine di righe. L'orchestratore manda gia' le sue
      # penalita' a ogni richiesta; questa vale per chi chiama il server
      # senza dichiararle (prove a mano, altri strumenti).
      --repeat-penalty 1.1
      ${gpu}
    ttl: 0

  # ---- embedding -------------------------------------------------------
  # Serve a ogni domanda E a ogni pezzo indicizzato, e pesa 440 MB.
  # Il tipo di pooling lo decide il modello, non si forza: bge-m3
  # usa il suo, e imporne un altro darebbe vettori diversi da quelli gia'
  # nell'indice — che e' il modo piu' rapido per rendere inutile tutto l'indice.
  "text-embedding-bge-m3-embeddings":
    name: "Embedding (bge-m3)"
    cmd: |
      ${llama}
      --model ${modelli}/Forrint/bge-m3-embeddings-Q4_K_M-GGUF/bge-m3-embeddings-q4_k_m.gguf
      --port ${PORT}
      --embeddings
      # --batch-size/--ubatch-size: un modello di embedding (e di rerank) deve
      # elaborare la sequenza INTERA in un colpo, e il valore predefinito di
      # llama.cpp e' 512 token. I pezzi che vengono dalle tabelle dei cataloghi
      # lo superano, e il server risponde 500 «input (522 tokens) is too large
      # to process» — con l'effetto che l'indicizzazione scrive i pezzi SENZA
      # vettori e la ricerca non li trova (visto il 21/09/2026, 376 pezzi
      # ciechi). 8192 e' il massimo che bge-m3 regge per sequenza.
      --batch-size 8192
      --ubatch-size 8192
      --ctx-size 8192
      ${gpu}
    ttl: 0

  # ---- rerank ----------------------------------------------------------
  # Il motivo per cui si lascia LM Studio: lui non espone nessun endpoint di
  # rerank (`/v1/rerank` risponde "Unexpected endpoint"). Misurato il
  # 21/09/2026: 2,6 s su 40 brani, +5,54 contro -11,04 fra pertinente e non.
  "text-embedding-bge-reranker-v2-m3":
    name: "Rerank (bge-reranker-v2-m3)"
    cmd: |
      ${llama}
      --model ${modelli}/gpustack/bge-reranker-v2-m3-GGUF/bge-reranker-v2-m3-Q8_0.gguf
      --port ${PORT}
      --rerank
      # --batch-size/--ubatch-size: un modello di embedding (e di rerank) deve
      # elaborare la sequenza INTERA in un colpo, e il valore predefinito di
      # llama.cpp e' 512 token. I pezzi che vengono dalle tabelle dei cataloghi
      # lo superano, e il server risponde 500 «input (522 tokens) is too large
      # to process» — con l'effetto che l'indicizzazione scrive i pezzi SENZA
      # vettori e la ricerca non li trova (visto il 21/09/2026, 376 pezzi
      # ciechi). 8192 e' il massimo che bge-m3 regge per sequenza.
      --batch-size 8192
      --ubatch-size 8192
      --pooling rank
      --ctx-size 8192
      ${gpu}
    ttl: 0

  # ---- descrizione delle immagini --------------------------------------
  # Serve durante la lettura dei documenti, a ogni blocco di pagine: resta
  # carico (3,3 GB) perche' ricaricarlo a ogni blocco costerebbe piu' della
  # VRAM che libera. `--mmproj` e' il pezzo che fa vedere DAVVERO le immagini
  # al modello: senza, risponde come se fossero testo.
  "qwen/qwen3-vl-4b":
    name: "Descrizione immagini (Qwen3-VL 4B)"
    cmd: |
      ${llama}
      --model ${modelli}/lmstudio-community/Qwen3-VL-4B-Instruct-GGUF/Qwen3-VL-4B-Instruct-Q4_K_M.gguf
      --mmproj ${modelli}/lmstudio-community/Qwen3-VL-4B-Instruct-GGUF/mmproj-Qwen3-VL-4B-Instruct-F16.gguf
      --port ${PORT}
      # UN solo slot, e tutto il contesto a lui: un'immagine piu' il prompt
      # supera i 4.096 token, e con --parallel 2 la lettura falliva con
      # «request (4096 tokens) exceeds the available context size» — errore
      # introdotto e visto il 21/09/2026. L'indicizzazione manda una pagina
      # alla volta, quindi due slot non servono a niente.
      --ctx-size 16384
      --parallel 1
      ${gpu}
    ttl: 0

  # ---- confronto: modello grande -------------------------------------
  # Serve a rispondere a UNA domanda con i numeri invece che con le opinioni:
  # «se il limite e' il modello, cambiamo il modello». Il 22/09/2026 il modello
  # da 8B, con «DEKOSTEINE ... 9 - 13 mm» davanti, ha risposto che il documento
  # non forniva le dimensioni. Qui si da' lo STESSO contesto a un modello
  # grande e si guarda se lo legge.
  #
  # Sta in un gruppo suo ESCLUSIVO: 12 GB non convivono con chat e VLM su una
  # scheda da 16. Caricarlo scarica gli altri, ed e' voluto.
  "qwen3.8-27b-gsq-rco":
    name: "Confronto (Qwen3.8 27B)"
    cmd: |
      ${llama}
      --model ${modelli}/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF/Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf
      --port ${PORT}
      # QUESTO MODELLO E' LENTO, e non per la memoria. Misurato il 22/09/2026
      # con la scheda VUOTA (0 MiB prima, 12.551 dopo, zero memoria
      # condivisa): 2,6 token al secondo. Una risposta da 300 token sono due
      # minuti. Per la chat e' inutilizzabile; resta buono per un confronto a
      # freddo, dove il tempo non conta.
      #
      # La causa e' la quantizzazione: IQ3_S e' costosa da decomprimere e
      # questo formato (GSQ-RCO, con i tensori MTP che llama.cpp scarta) non
      # ha kernel CUDA ottimizzati. Un Q4_K_M dello stesso modello andrebbe
      # piu' forte pur pesando di piu'.
      #
      # Prima di arrivarci ho incolpato tre cose sbagliate: il contesto a
      # 16384, i buffer dei modelli piccoli, il traboccamento in memoria
      # condivisa. Nessuna delle tre. Due trappole da ricordare:
      #   - `nvidia-smi` NON vede la memoria condivisa, e il «96 per cento di
      #     utilizzo» non distingue una scheda che lavora da una che aspetta.
      #     L'unica misura che lo distingue sono i token al secondo.
      #   - i 1,9-4,7 GB di «GPU condivisa» dei modelli piccoli NON sono un
      #     traboccamento: sono i buffer di --batch-size 8192 allocati come
      #     memoria host bloccata. Ci sono anche a scheda semivuota.
      #
      # 8192 e non 16384, con la cache KV a 8 bit: non serviva a risolvere la
      # lentezza (non l'ha risolta), ma un 27B con 16k di contesto f16 chiede
      # circa 4 GB di sola cache, e tenerli occupati per un modello di
      # confronto e' sprecato.
      --ctx-size 8192
      --cache-type-k q8_0
      --cache-type-v q8_0
      --parallel 1
      ${gpu}
    ttl: 1800

routing:
  router:
    use: group
    settings:
      groups:
        # I PICCOLI non escono mai. Embedding e rerank pesano 0,33 e 0,46 GB e
        # servono a ogni domanda: scaricarli per far posto a un modello grande
        # sarebbe un pessimo affare. `persistent` vuol dire che nessun altro
        # gruppo puo' buttarli fuori, nemmeno uno esclusivo.
        "piccoli":
          persistent: true
          swap: false
          exclusive: false
          members:
            - "text-embedding-bge-m3-embeddings"
            - "text-embedding-bge-reranker-v2-m3"

        # I GRANDI convivono: chat 5,5 GB + VLM 4,3 = 9,8, piu' i piccoli fa
        # 10,6 su 16,3, e a Docling resta lo spazio per leggere.
        "grandi":
          swap: false
          exclusive: false
          members:
            - "qwen3-8b-gsq"
            - "qwen/qwen3-vl-4b"

        # Il 27B da solo: 12 GB non convivono con chat e VLM. Caricarlo
        # scarica il gruppo «grandi» — ma NON i piccoli, che restano.
        # 12 + 0,8 = 12,8 su 16,3.
        "confronto":
          swap: true
          exclusive: true
          members:
            - "qwen3.8-27b-gsq-rco"
