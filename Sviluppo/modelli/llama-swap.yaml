# Configurazione di llama-swap: sostituisce LM Studio come SERVER dei modelli.
#
#   llama-swap.exe --config llama-swap.yaml --listen 127.0.0.1:1235
#
# Perche' non Docker: i modelli girano sull'host, come oggi con LM Studio. Su
# Windows Docker tiene per se' memoria e GPU e non le restituisce; i container
# raggiungono l'host con host.docker.internal, che e' gia' il modo in cui
# funziona il progetto (decisione del 21/09/2026).
#
# LM Studio resta installato come GESTORE dei modelli — e' lui che li scarica e
# tiene aggiornate le versioni di llama.cpp — ma non fa piu' il server. Per
# questo i .gguf stanno ancora nella sua cartella: nessun file duplicato,
# niente da riscaricare. Se un giorno LM Studio esce di scena, si sposta la
# cartella e si cambia la macro `modelli` qui sotto.
#
# I NOMI dei modelli sono identici a quelli che esponeva LM Studio: cosi'
# litellm-config.yaml, .env e ingestion non cambiano di una riga. Si sposta
# solo la porta.
#
# TTL 0 OVUNQUE, per scelta (21/09/2026): tutti i modelli restano in memoria,
# nessuno si scarica da solo per inattivita'. Il costo di una ricarica non e'
# solo l'attesa — e' che cade addosso a chi sta facendo la domanda, e in una
# lettura di documenti si paga a ogni blocco. La VRAM costa meno del tempo
# delle persone.
#
# Questo NON disattiva lo scarico manuale: l'indicizzazione continua a
# scaricare il modello di chat quando serve spazio a Docling (scarica_llm in
# ingestion/indicizza.py, POST /api/models/unload/<id>), e llama-swap lo
# ricarica alla prima domanda successiva. ttl vuol dire «non scaricarlo da
# solo», non «non si puo' scaricare».

healthCheckTimeout: 500
logLevel: info

macros:
  # Binari ufficiali di llama.cpp (build CUDA per Windows), non quelli interni
  # di LM Studio: quelli stanno in una cartella privata di un altro programma e
  # cambiano quando lui si aggiorna.
  llama: "C:/Users/uvolp/AppData/Local/llama-stack/bin/llama-server.exe"
  modelli: "C:/Users/uvolp/.lmstudio/models"
  # --n-gpu-layers 99 = tutto sulla GPU. Se un modello non ci sta, llama.cpp
  # non parte: meglio un errore leggibile che venti minuti di lettura in CPU.
  gpu: "--n-gpu-layers 99 --flash-attn on"

models:
  # ---- chat ------------------------------------------------------------
  # Contesto e parallelismo come li aveva LM Studio: 4 richieste insieme,
  # perche' l'applicazione e' multiutente (4-5 persone).
  "qwen3-8b-gsq":
    name: "Chat (Qwen3 8B GSQ)"
    cmd: |
      ${llama}
      --model ${modelli}/ISTA-DASLab/Qwen3-8B-GGUF-GSQ/qwen3-8b-Q3_K_M.gguf
      --port ${PORT}
      --ctx-size 10496
      --parallel 4
      ${gpu}
    ttl: 0

  # ---- embedding -------------------------------------------------------
  # Serve a ogni domanda E a ogni pezzo indicizzato, e pesa 440 MB.
  # Il tipo di pooling lo decide il modello, non si forza: bge-m3
  # usa il suo, e imporne un altro darebbe vettori diversi da quelli gia'
  # nell'indice — che e' il modo piu' rapido per rendere inutile tutto l'indice.
  "text-embedding-bge-m3-embeddings":
    name: "Embedding (bge-m3)"
    cmd: |
      ${llama}
      --model ${modelli}/Forrint/bge-m3-embeddings-Q4_K_M-GGUF/bge-m3-embeddings-q4_k_m.gguf
      --port ${PORT}
      --embeddings
      --ctx-size 8192
      ${gpu}
    ttl: 0

  # ---- rerank ----------------------------------------------------------
  # Il motivo per cui si lascia LM Studio: lui non espone nessun endpoint di
  # rerank (`/v1/rerank` risponde "Unexpected endpoint"). Misurato il
  # 21/09/2026: 2,6 s su 40 brani, +5,54 contro -11,04 fra pertinente e non.
  "text-embedding-bge-reranker-v2-m3":
    name: "Rerank (bge-reranker-v2-m3)"
    cmd: |
      ${llama}
      --model ${modelli}/gpustack/bge-reranker-v2-m3-GGUF/bge-reranker-v2-m3-Q8_0.gguf
      --port ${PORT}
      --rerank
      --pooling rank
      --ctx-size 8192
      ${gpu}
    ttl: 0

  # ---- descrizione delle immagini --------------------------------------
  # Serve durante la lettura dei documenti, a ogni blocco di pagine: resta
  # carico (3,3 GB) perche' ricaricarlo a ogni blocco costerebbe piu' della
  # VRAM che libera. `--mmproj` e' il pezzo che fa vedere DAVVERO le immagini
  # al modello: senza, risponde come se fossero testo.
  "qwen/qwen3-vl-4b":
    name: "Descrizione immagini (Qwen3-VL 4B)"
    cmd: |
      ${llama}
      --model ${modelli}/lmstudio-community/Qwen3-VL-4B-Instruct-GGUF/Qwen3-VL-4B-Instruct-Q4_K_M.gguf
      --mmproj ${modelli}/lmstudio-community/Qwen3-VL-4B-Instruct-GGUF/mmproj-Qwen3-VL-4B-Instruct-F16.gguf
      --port ${PORT}
      --ctx-size 8192
      --parallel 4
      ${gpu}
    ttl: 0

routing:
  router:
    use: group
    settings:
      groups:
        # Tutti e quattro insieme: 8,7 GB misurati su 16,3 della scheda, che
        # lasciano spazio a Docling (picco misurato 6,1 GB). Stretto ma ci sta,
        # e la valvola di sfogo esiste gia': durante la finestra notturna
        # l'indicizzazione scarica il modello di chat da sola (BLOCCO_LLM in
        # ingestion/indicizza.py).
        #
        # Se la VRAM non dovesse bastare, la modifica e' UNA riga: swap: true
        # fa in modo che chat e VLM non stiano mai caricati insieme. Costa una
        # ricarica ogni volta che si passa dall'uno all'altro.
        "tutti":
          swap: false
          exclusive: false
          members:
            - "qwen3-8b-gsq"
            - "text-embedding-bge-m3-embeddings"
            - "text-embedding-bge-reranker-v2-m3"
            - "qwen/qwen3-vl-4b"
