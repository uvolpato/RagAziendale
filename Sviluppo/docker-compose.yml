# Assistente aziendale — base condivisa fra sviluppo e produzione.
#
# Le differenze di sviluppo (hostname .localhost, GPU, porte) stanno in
# docker-compose.override.yml, che Docker applica da solo. In produzione
# quel file non c'e.
#
# REGOLA: nessun componente rivolto all'utente possiede una chiave del
# modello. Niente env_file globali: ogni servizio riceve solo le variabili
# che gli servono, elencate una per una.
name: assistente

services:

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    environment:
      APP_HOST: ${APP_HOST}
      SSO_HOST: ${SSO_HOST}
      REALM: ${REALM}
    depends_on: [librechat, keycloak]

  postgres:
    # pgvector incluso: archivio documenti + registro sorgenti + taint + tracce
    # ponytail: una sola istanza, due database. Keycloak non merita un container di DB suo.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 10

  keycloak:
    # Versione esatta, non '26.x': branding/tema-keycloak/login/login.ftl e una
    # copia del template base di QUESTA versione. Per aggiornare: confrontare il
    # login.ftl base vecchio e nuovo, fondere, rilanciare verifica_pagina_login.
    # >= 26.2 serve per la delega per azienda (Fine-Grained Admin Permissions v2,
    # decisione 60). Il primo avvio di una versione nuova migra lo schema del DB:
    # backup prima (pg_dump keycloak).
    image: quay.io/keycloak/keycloak:26.7.4
    restart: unless-stopped
    # Realm importato da file: riproducibile da zero, non cliccato a mano.
    # --import-realm importa solo se il realm non esiste: rilanciarlo e innocuo.
    command: start --import-realm
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      # Tema della pagina di accesso SSO. Montato, non incluso nell'immagine:
      # per un cliente nuovo si cambia il CSS e il logo in branding/.
      - ./branding/tema-keycloak:/opt/keycloak/themes/azienda:ro
      # UN SOLO file logo per chat e login: branding/logo.png viene montato
      # sopra quello del tema, che resta come segnaposto se il mount manca.
      - ./branding/logo.png:/opt/keycloak/themes/azienda/login/resources/img/logo.png:ro
      - ./branding/favicon.ico:/opt/keycloak/themes/azienda/login/resources/img/favicon.ico:ro
    environment:
      # Sostituiti dentro realm-azienda.json con la sintassi $(env:VAR),
      # cosi il file resta committabile senza segreti.
      OPENID_CLIENT_SECRET: ${OPENID_CLIENT_SECRET}
      APP_HOST: ${APP_HOST}
      TEST_USER_PASSWORD: ${TEST_USER_PASSWORD}
      NOME_AZIENDA: ${NOME_AZIENDA}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: https://${SSO_HOST}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  mongo:
    # Richiesto da LibreChat per utenti e storico conversazioni.
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  librechat:
    # Pinnato a un tag rilasciato, non 'latest' (decisione 31: ogni
    # aggiornamento rilancia T1.5/T1.6 prima della promozione).
    # v0.8.7 = ultima release stabile al 18/09/2026 (le v0.8.8-rc* sono
    # pre-release). Dopo il pin: rilanciare T1.4 e ri-verificare A1.
    image: ghcr.io/danny-avila/librechat:v0.8.7
    restart: unless-stopped
    environment:
      # --- NESSUNA chiave di modello qui. E' il componente rivolto all'utente.
      MONGO_URI: mongodb://mongo:27017/LibreChat
      CONFIG_PATH: /app/librechat.yaml
      DOMAIN_CLIENT: https://${APP_HOST}
      DOMAIN_SERVER: https://${APP_HOST}
      SEARCH: "false"              # ponytail: niente Meilisearch in fase 1
      ALLOW_REGISTRATION: "false"  # gli utenti nascono in Keycloak
      ALLOW_EMAIL_LOGIN: "false"   # nessuna password locale: solo SSO
      ALLOW_SOCIAL_LOGIN: "true"
      # SSO come prima pagina: chi non ha sessione, o l'ha scaduta, va
      # direttamente a Keycloak senza vedere una pagina di login intermedia.
      # LibreChat applica un cooldown sui tentativi falliti, cosi un errore
      # di autenticazione non produce un loop di redirect.
      OPENID_AUTO_REDIRECT: "true"
      # Senza questo il logout non funziona: LibreChat chiude la PROPRIA
      # sessione, ma quella SSO di Keycloak resta aperta, il redirect
      # automatico torna a Keycloak, che emette un nuovo codice senza chiedere
      # nulla — e l'utente rientra in chat. Sembra che "disconnetti" non faccia
      # niente. Con questo, il logout passa dall'end_session_endpoint e chiude
      # anche la sessione di Keycloak.
      # Richiede post.logout.redirect.uris sul client (nel realm c'e' gia').
      OPENID_USE_END_SESSION_ENDPOINT: "true"
      # --- Personalizzazione cliente
      APP_TITLE: ${NOME_ASSISTENTE}
      CUSTOM_FOOTER: ${PIE_DI_PAGINA}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CREDS_KEY: ${CREDS_KEY}
      CREDS_IV: ${CREDS_IV}
      ORCHESTRATOR_KEY: ${ORCHESTRATOR_KEY}
      # --- SSO verso Keycloak
      OPENID_ISSUER: ${OPENID_ISSUER}
      OPENID_CLIENT_ID: ${OPENID_CLIENT_ID}
      OPENID_CLIENT_SECRET: ${OPENID_CLIENT_SECRET}
      OPENID_CALLBACK_URL: /oauth/openid/callback
      OPENID_SESSION_SECRET: ${OPENID_SESSION_SECRET}
      OPENID_BUTTON_LABEL: Accedi con account aziendale
      # NIENTE offline_access. Da Keycloak 26.1, se il primo login chiede
      # offline_access, Keycloak crea solo la sessione offline e cancella quella
      # SSO: ogni redirect successivo richiede di nuovo le credenziali (issue
      # keycloak#36717, nessuna opzione per evitarlo). Keycloak emette comunque un
      # refresh token "online" nel flusso a codice: i placeholder
      # {{LIBRECHAT_OPENID_*}} si popolano lo stesso (verificato il 18/09/2026 con
      # un finto orchestratore: token con utente, aud e gruppi corretti).
      # La sessione chat dura quanto la sessione SSO (realm: ssoSessionIdle/Max).
      OPENID_SCOPE: openid profile email
      OPENID_REUSE_TOKENS: "true"
      OPENID_REUSE_MAX_SESSION_AGE_MS: "900000"
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      # Logo e favicon del cliente montati sopra gli asset serviti: niente
      # rebuild dell'immagine. Sostituire i file in branding/ e riavviare.
      - ./branding/logo.png:/app/client/dist/assets/logo.svg:ro
      # UN SOLO file per l'icona dell'indirizzo, montato su tutte le taglie
      # che LibreChat dichiara: i browser la scalano. Sostituire
      # branding/favicon.ico e riavviare.
      - ./branding/favicon.ico:/app/client/dist/assets/favicon-16x16.png:ro
      - ./branding/favicon.ico:/app/client/dist/assets/favicon-32x32.png:ro
      - ./branding/favicon.ico:/app/client/dist/assets/apple-touch-icon-180x180.png:ro
      - ./branding/favicon.ico:/app/client/dist/assets/icon-192x192.png:ro
      - ./branding/favicon.ico:/app/client/dist/assets/maskable-icon.png:ro
    depends_on:
      - mongo
      - keycloak

  # NOTA: i modelli non stanno qui. La macchina con GPU e un host separato:
  # vedi docker-compose.inference.yml. Da questo stack i modelli interni sono
  # endpoint HTTP come qualsiasi altro servizio esterno — cambia solo che
  # l'endpoint e dentro il perimetro aziendale.

  orchestratore:
    # Endpoint OpenAI-compatible: LibreChat crede di parlare con un modello.
    # Non possiede chiavi di provider: i modelli li raggiunge solo via proxy.
    # ponytail: mcp-documenti gira in-process. Container separato al secondo MCP server.
    build: ./orchestratore
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/rag
      OIDC_JWKS_URL: http://keycloak:8080/realms/${REALM}/protocol/openid-connect/certs
      OIDC_ISSUER: https://${SSO_HOST}/realms/${REALM}
      OIDC_AUDIENCE: orchestratore
      ORCHESTRATOR_KEY: ${ORCHESTRATOR_KEY}
      # Host pubblico per firmare gli URL delle immagini servite in chat.
      APP_HOST: ${APP_HOST}
      # --- I modelli stanno su llama-swap (host), raggiunti DIRETTAMENTE.
      # Niente proxy di routing (litellm tolto il 24/09/2026): il modello di
      # chat e' MODELLO_CHAT, l'embedding e' EMBEDDING_MODELLO.
      MODELLI_HOST: ${MODELLI_HOST-host.docker.internal:1235}
      MODELLO_CHAT: ${MODELLO_CHAT-qwen3.6-35b-a3b-gsq-hybrid}
      EMBEDDING_MODELLO: ${EMBEDDING_MODELLO-text-embedding-bge-m3-embeddings}
      # Fase 1b: i dati 'interno' rispondono solo su questa rotta (gate). In
      # sviluppo punta allo stesso modello locale (GUIDA-MODELLI.md §4).
      LLM_RAGIONAMENTO_INTERNO: ragionamento_interno
      # Coda del prompt di sistema per le stranezze del modello scelto. Con
      # Qwen3 serve "/no_think": ragiona a voce alta e la risposta arriverebbe
      # vuota (il pensiero viaggia in reasoning_content, che LibreChat ignora).
      SUFFISSO_SISTEMA: ${SUFFISSO_SISTEMA-}
      # Prova A/B: 1 = salta riformulazione ed estrazione vincoli, si cerca la
      # domanda dell'utente tale e quale (comportamento RAGFlow/Onyx). 0/assente
      # = flusso attuale. Non e' codice: si cambia qui e si riavvia.
      SENZA_ESTRAZIONE: ${SENZA_ESTRAZIONE-0}
      # Prova: bypassa la tabella sinonimi come fonte; i termini multilingue
      # li produce il modello col CATALOGO davanti. 1 = attivo. Reversibile.
      SENZA_SINONIMI: ${SENZA_SINONIMI-1}
      # Prova: l'agente di ricerca (cerca-guarda-riprova, D17) accanto ai
      # sinonimi. si = attivo, altrimenti la sola ricerca diretta. Si cambia
      # qui e si riavvia, come SENZA_ESTRAZIONE.
      RICERCA_AGENTE: ${RICERCA_AGENTE-si}
      # Le immagini si offrono in fondo alla risposta e si mostrano a chi
      # scrive "mostra": quattro figure attaccate a ogni risposta sono rumore.
      # 0 = le attacca sempre, come prima.
      IMMAGINI_SU_RICHIESTA: ${IMMAGINI_SU_RICHIESTA-1}
      # --- Allowlist di egress: il gate consente SOLO questi host. Qualsiasi
      # richiesta verso un host non dichiarato e un errore, non un warning.
      EGRESS_INTERNAL: ${EGRESS_INTERNAL}
      EGRESS_EXTERNAL: ${EGRESS_EXTERNAL}
      # Le immagini estratte stanno dentro le cartelle dei documenti
      # (<fonte>/_immagini/...): qui la radice si monta in SOLA LETTURA, il
      # percorso esatto lo dice la tabella immagini e l'URL e' firmato.
      IMMAGINI: /cartelle
    volumes:
      - ${CARTELLE_PATH:-./cartelle}:/cartelle:ro
    depends_on:
      postgres:
        condition: service_healthy

  amministrazione:
    # Portale dopo il login e amministrazione (decisione 58).
    # Nessun segreto: client Keycloak pubblico con PKCE, sessioni in memoria.
    # Utenti, gruppi e ruoli restano in Keycloak (decisione 60): qui si leggono
    # con il token dell'amministratore, non con credenziali proprie.
    build: ./amministrazione
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/rag
      APP_HOST: ${APP_HOST}
      SSO_HOST: ${SSO_HOST}
      REALM: ${REALM}
      KEYCLOAK_INTERNO: http://keycloak:8080
      NOME_AZIENDA: ${NOME_AZIENDA}
      NOME_ASSISTENTE: ${NOME_ASSISTENTE}
      MESSAGGIO_BENVENUTO: ${MESSAGGIO_BENVENUTO}
      PIE_DI_PAGINA: ${PIE_DI_PAGINA}
      # Vuoti finche' Dagster e Uptime Kuma non sono installati: la pagina
      # segnaposto dice "non ancora installato" invece di un link rotto.
      DAGSTER_URL: ${DAGSTER_URL:-}
      UPTIME_URL: ${UPTIME_URL:-}
      # Servizio dei collegamenti: il pannello gli inoltra le password digitate
      # dal Superutente; non ha la chiave dei segreti (decisione 70).
      CONNETTORI_URL: http://connettori:8000
      CONNETTORI_KEY: ${CONNETTORI_KEY}
      # Servizio azioni (riavvio/stop dei servizi): il pannello inoltra, non
      # ha il socket di Docker.
      AZIONI_URL: http://azioni:8000
      AZIONI_KEY: ${AZIONI_KEY}
    volumes:
      # Stato dei sistemi: legge Uptime Kuma in sola lettura (SQLite, WAL).
      - uptime-kuma-data:/opt/uptime-kuma:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  connettori:
    # Custode dei segreti dei collegamenti ai gestionali (SPECIFICA-CONNETTORI.md
    # §4.1). Unico componente con CHIAVE_CREDENZIALI: cifra e decifra in memoria.
    # Raggiunto solo dal pannello, sulla rete interna del compose.
    build:
      context: .
      dockerfile: servizio-connettori/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/rag
      CHIAVE_CREDENZIALI: ${CHIAVE_CREDENZIALI}
      CHIAVE_CREDENZIALI_PRECEDENTE: ${CHIAVE_CREDENZIALI_PRECEDENTE:-}
      CONNETTORI_KEY: ${CONNETTORI_KEY}
      # Scheduler ponte: disattivato quando pianifica Dagster (decisione 60).
      SCHEDULER_INTERVALLO: ${SCHEDULER_INTERVALLO:-60}
      SCHEDULER_OFF: ${SCHEDULER_OFF:-}
    volumes:
      # Stato dei sistemi (Uptime Kuma) per il controllo down->anomalia.
      - uptime-kuma-data:/opt/uptime-kuma:ro
    depends_on:
      postgres:
        condition: service_healthy

  azioni:
    # Riavvio/stop dei servizi dal pannello (whitelist + registro). L'unico
    # componente col socket di Docker: interno, raggiunto solo dal pannello.
    build: ./azioni
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/rag
      AZIONI_KEY: ${AZIONI_KEY}
      AZIONI_ALLOWED: postgres,keycloak,caddy,mongo,librechat,amministrazione,connettori,dagster-webserver,dagster-daemon,uptime-kuma
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy

  oauth2-proxy:
    # SSO davanti agli strumenti esterni (Dagster, poi Uptime Kuma), decisione 60.
    # Il login e' quello di Keycloak: niente password locale. In reverse-proxy
    # mode davanti a Dagster (vedi Caddyfile, blocco dagster.localhost).
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.2
    restart: unless-stopped
    # Il token di accesso Keycloak ha aud=["account", ...] (non il client_id):
    # si ammette "account", che Keycloak include sempre.
    command: ["--oidc-extra-audience=account"]
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://keycloak:8080/realms/${REALM}
      OAUTH2_PROXY_CLIENT_ID: dagster
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_REDIRECT_URL: https://dagster.localhost/oauth2/callback
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_ALLOWED_GROUP: /amministratori/*
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_UPSTREAMS: http://dagster-webserver:3000
      # Il token di accesso Keycloak ha aud=["account", ...] (non il client_id):
      # si ammette "account", che Keycloak include sempre (vedi args).
      OAUTH2_PROXY_OIDC_EXTRA_AUDIENCE: account
      # Keycloak si raggiunge dall'interno (http://keycloak), ma l'issuer nei
      # token e' l'hostname esterno (https://sso.localhost). La discovery dice
      # l'issuer esterno, e i token lo rispettano: qui si salta solo il confronto
      # fra issuer configurato e issuer scoperto, non la validazione del token.
      OAUTH2_PROXY_INSECURE_OIDC_SKIP_ISSUER_VERIFICATION: "true"
      # CA interna di Caddy: Keycloak e' raggiunto via http://keycloak (senza TLS).
      OAUTH2_PROXY_SSL_INSECURE_SKIP_VERIFY: "true"
    depends_on:
      - keycloak

  uptime-kuma:
    # Monitoraggio dei servizi (decisione 60): su/giu' degli altri componenti.
    # Autenticazione propria disattivata: davanti c'e' oauth2-proxy con SSO.
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    command: ["node", "server/server.js", "--disable-auth"]
    volumes:
      - uptime-kuma-data:/app/data

  oauth2-proxy-immagini:
    # Sessione per le FIGURE dei documenti, non per la chat: un tag <img> nel
    # browser non manda nessuna identita', solo i cookie del dominio. Qui la
    # mette oauth2-proxy, che autentica con Keycloak (client `immagini`) e
    # passa all'orchestratore i gruppi della persona: le ACL si applicano
    # quando l'immagine viene servita, non solo quando l'URL viene emesso.
    # Cookie con nome e percorso propri: non tocca la sessione di LibreChat,
    # che vive sullo stesso dominio.
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.2
    restart: unless-stopped
    command: ["--oidc-extra-audience=account"]
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      # L'issuer e' quello ESTERNO, perche' e' quello che Keycloak scrive nei
      # token. Gli endpoint si dichiarano a mano invece di scoprirli: il
      # browser va all'esterno (auth), lo scambio del codice e la lettura
      # delle chiavi restano sulla rete interna, in chiaro come gia' fanno gli
      # altri servizi. Cosi' l'issuer combacia e non si disattiva nessuna
      # verifica (gli altri tre proxy fanno l'opposto: discovery + skip).
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://${SSO_HOST}/realms/${REALM}
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_LOGIN_URL: https://${SSO_HOST}/realms/${REALM}/protocol/openid-connect/auth
      OAUTH2_PROXY_REDEEM_URL: http://keycloak:8080/realms/${REALM}/protocol/openid-connect/token
      OAUTH2_PROXY_PROFILE_URL: http://keycloak:8080/realms/${REALM}/protocol/openid-connect/userinfo
      OAUTH2_PROXY_OIDC_JWKS_URL: http://keycloak:8080/realms/${REALM}/protocol/openid-connect/certs
      OAUTH2_PROXY_CLIENT_ID: immagini
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_IMMAGINI_CLIENT_SECRET}
      OAUTH2_PROXY_REDIRECT_URL: https://${APP_HOST}/oauth2/callback
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_IMMAGINI_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_NAME: _sessione_immagini
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      # Una risposta porta piu' figure, e i tag <img> partono TUTTI INSIEME
      # senza sessione: sono altrettanti login in parallelo. Con un cookie
      # CSRF solo, l'ultimo sovrascrive gli altri e si vede una figura su
      # quattro (visto il 21/09/2026: tre 302 e un 200). Un cookie CSRF per
      # richiesta e i flussi non si pestano i piedi.
      OAUTH2_PROXY_COOKIE_CSRF_PER_REQUEST: "true"
      OAUTH2_PROXY_COOKIE_CSRF_EXPIRE: 5m
      # Chi e' dentro l'azienda puo' vedere le figure che la RICERCA gli ha
      # gia' concesso: il permesso vero lo applica l'orchestratore, immagine
      # per immagine, con i gruppi che arrivano da qui.
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_UPSTREAMS: http://orchestratore:8000
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "false"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
    depends_on: [keycloak, orchestratore]

  oauth2-proxy-uptime:
    # SSO per Uptime Kuma (stesso pattern di Dagster), client Keycloak `uptime`.
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.2
    restart: unless-stopped
    command: ["--oidc-extra-audience=account"]
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://keycloak:8080/realms/${REALM}
      OAUTH2_PROXY_CLIENT_ID: uptime
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_UPTIME_CLIENT_SECRET}
      OAUTH2_PROXY_REDIRECT_URL: https://uptime.localhost/oauth2/callback
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_UPTIME_COOKIE_SECRET}
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_ALLOWED_GROUP: /amministratori/*
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_UPSTREAMS: http://uptime-kuma:3001
      OAUTH2_PROXY_INSECURE_OIDC_SKIP_ISSUER_VERIFICATION: "true"
      # Il token endpoint di Keycloak e' l'hostname esterno (CA interna Caddy):
      # senza questo lo scambio del codice fallisce con "unknown authority".
      OAUTH2_PROXY_SSL_INSECURE_SKIP_VERIFY: "true"
    depends_on:
      - keycloak
      - uptime-kuma

  dagster-webserver:
    # UI e GraphQL di Dagster (decisione 60): pianifica e mostra le importazioni.
    # La code location sta in ./dagster (definitions.py). In sviluppo e' dietro
    # Caddy con basic_auth; in produzione dietro oauth2-proxy + Keycloak.
    build: ./dagster
    restart: unless-stopped
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "workspace.yaml"]
    environment:
      CONNETTORI_URL: http://connettori:8000
      CONNETTORI_KEY: ${CONNETTORI_KEY}
    volumes:
      - dagster-data:/opt/dagster/dagster_home
    depends_on:
      - connettori

  dagster-daemon:
    # Esegue le schedule: a ogni scadenza crea una run del job. Condivide lo
    # stesso DAGSTER_HOME del webserver (storico e schedule in SQLite, ponytail:
    # in produzione si passa a Postgres).
    build: ./dagster
    restart: unless-stopped
    command: ["dagster-daemon", "run", "-w", "workspace.yaml"]
    environment:
      CONNETTORI_URL: http://connettori:8000
      CONNETTORI_KEY: ${CONNETTORI_KEY}
    volumes:
      - dagster-data:/opt/dagster/dagster_home
    depends_on:
      - connettori

  ingestion:
    # Indicizza le cartelle collegate (decisioni 61-64): un giro ogni
    # INTERVALLO secondi. Legge le cartelle in SOLA LETTURA: chi deposita i
    # file lo fa sulla condivisione, non qui. I vettori li chiede a llama-swap
    # diretto (come l'orchestratore, litellm tolto il 24/09/2026).
    #   docker compose logs -f ingestion                      cosa sta facendo
    #   docker compose run --rm ingestion python indicizza.py --una-volta
    build: ./ingestion
    restart: unless-stopped
    # Docling con layout, tabelle e OCR occupa 2,5-3 GB mentre legge. Il tetto
    # fa si' che, se sbaglia, muoia questo container e non la VM di Docker con
    # tutto lo stack (successo il 19/09/2026 con due giri in parallelo). Il
    # lavoro fatto resta: ogni file e' salvato appena letto.
    mem_limit: 4g
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/rag
      # I modelli (embedding, VLM) stanno su llama-swap, raggiunti direttamente.
      MODELLI_HOST: ${MODELLI_HOST-host.docker.internal:1235}
      EMBEDDING_MODELLO: ${EMBEDDING_MODELLO-text-embedding-bge-m3-embeddings}
      # Le immagini dei cataloghi le descrive Docling con il suo VLM locale
      # (SmolVLM, dentro l'immagine): nessun modello esterno da chiamare.
      # Dove si leggono i documenti (layout, tabelle, OCR): docling-serve su
      # una GPU. Vuoto = sul posto, su CPU (lento ma funziona). In sviluppo lo
      # imposta docker-compose.override.yml; in produzione e' il server GPU,
      # dietro TLS e INFERENCE_TOKEN (docker-compose.inference.yml).
      DOCLING_URL: ${DOCLING_URL:-}
      # Certificato del server GPU se interno (tls internal di Caddy): percorso
      # del .crt montato nel container. Vuoto = certificati di sistema.
      DOCLING_CA: ${DOCLING_CA:-}
      INFERENCE_TOKEN: ${INFERENCE_TOKEN}
      INTERVALLO: ${INTERVALLO_INDICIZZAZIONE:-300}
    volumes:
      # Radice delle cartelle: in produzione la condivisione di rete montata
      # sull'host. Il percorso di ogni fonte e' relativo a questa radice.
      # IN SCRITTURA, e solo per questo: le immagini estratte dai documenti si
      # salvano accanto ai documenti stessi, in <cartella fonte>/_immagini/,
      # dove chi lavora le apre senza passare da Docker (il prefisso '_' le
      # tiene fuori dall'indicizzazione). Il servizio non scrive altrove: se la
      # condivisione e' in sola lettura, i documenti entrano senza immagini.
      - ${CARTELLE_PATH:-./cartelle}:/cartelle
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg-data:
  mongo-data:
  caddy-data:
  dagster-data:
  uptime-kuma-data:
